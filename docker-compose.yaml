#
#  Project Zomboid Build 42 dedicated server - Docker Compose (Dokploy-ready).
#  GPL-3.0 (see LICENSE).
#
#  Settings come from the .env file (in Dokploy: the "Environment" tab).
#  See .env.example for every variable and its meaning.
#
#  Host folders (created automatically, owned by UID 1000):
#    /srv/zomboid/server  -> game installation (rebuildable, ~GBs)
#    /srv/zomboid/data    -> configs, world saves, logs, mods (BACK THIS UP)
#

services:
  zomboid:
    build:
      context: .
      dockerfile: docker/zomboid-dedicated-server.Dockerfile
    image: zomboid-dedicated-server:local
    container_name: zomboid
    restart: unless-stopped
    # Time for the in-game "quit" (world save) before Docker kills the
    # process. Must be larger than SHUTDOWN_TIMEOUT.
    stop_grace_period: 2m
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    # Game traffic goes straight to the host: no Traefik/HTTP proxy.
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
    volumes:
      - /srv/zomboid/server:/home/steam/ZomboidDedicatedServer
      - /srv/zomboid/data:/home/steam/Zomboid
    # Hard cap for the whole container. Rule of thumb: MAX_RAM + ~1.5 GB
    # (JVM threads, code cache, native buffers). 8 GB VPS: 4g heap -> 6g.
    mem_limit: ${PZ_MEM_LIMIT:-6g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
